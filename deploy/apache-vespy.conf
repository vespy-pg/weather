<VirtualHost *:80>
    ServerName vespy.pl
    ServerAdmin webmaster@vespy.pl
    DocumentRoot /var/www

    RedirectMatch 301 ^/pogoda$ /pogoda/

    ProxyPreserveHost On
    ProxyPass /pogoda/ http://127.0.0.1:18080/ connectiontimeout=5 timeout=30 retry=0
    ProxyPassReverse /pogoda/ http://127.0.0.1:18080/

    ErrorLog ${APACHE_LOG_DIR}/vespy-error.log
    CustomLog ${APACHE_LOG_DIR}/vespy-access.log combined
</VirtualHost>
