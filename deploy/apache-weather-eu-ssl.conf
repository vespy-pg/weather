<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName weather.vespy.eu
    ServerAdmin webmaster@vespy.eu

    GeoIPEnable On
    GeoIPDBFile /usr/share/GeoIP/GeoIP.dat
    RequestHeader unset X-Visitor-Country
    RequestHeader set X-Visitor-Country "%{GEOIP_COUNTRY_CODE}e" env=GEOIP_COUNTRY_CODE

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:18080/ connectiontimeout=5 timeout=30 retry=0
    ProxyPassReverse / http://127.0.0.1:18080/

    ErrorLog ${APACHE_LOG_DIR}/weather-eu-error.log
    CustomLog ${APACHE_LOG_DIR}/weather-eu-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/weather.vespy.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/weather.vespy.eu/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

<VirtualHost *:443>
    ServerName pogoda.vespy.eu
    ServerAdmin webmaster@vespy.eu

    Redirect permanent / https://weather.vespy.eu/

    ErrorLog ${APACHE_LOG_DIR}/weather-eu-error.log
    CustomLog ${APACHE_LOG_DIR}/weather-eu-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/weather.vespy.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/weather.vespy.eu/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

<VirtualHost *:443>
    ServerName api.weather.vespy.eu
    ServerAdmin webmaster@vespy.eu

    GeoIPEnable On
    GeoIPDBFile /usr/share/GeoIP/GeoIP.dat
    RequestHeader unset X-Visitor-Country
    RequestHeader set X-Visitor-Country "%{GEOIP_COUNTRY_CODE}e" env=GEOIP_COUNTRY_CODE

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:18080/ connectiontimeout=5 timeout=30 retry=0
    ProxyPassReverse / http://127.0.0.1:18080/

    ErrorLog ${APACHE_LOG_DIR}/weather-api-error.log
    CustomLog ${APACHE_LOG_DIR}/weather-api-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/weather.vespy.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/weather.vespy.eu/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
