<VirtualHost *:80>
    ServerName weather.vespy.eu
    ServerAdmin webmaster@vespy.eu

    Redirect permanent / https://pogoda.vespy.eu/

    ErrorLog ${APACHE_LOG_DIR}/weather-eu-error.log
    CustomLog ${APACHE_LOG_DIR}/weather-eu-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName pogoda.vespy.eu
    ServerAdmin webmaster@vespy.eu

    Redirect permanent / https://pogoda.vespy.eu/

    ErrorLog ${APACHE_LOG_DIR}/weather-eu-error.log
    CustomLog ${APACHE_LOG_DIR}/weather-eu-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName api.weather.vespy.eu
    ServerAdmin webmaster@vespy.eu

    Redirect permanent / https://api.weather.vespy.eu/

    ErrorLog ${APACHE_LOG_DIR}/weather-api-error.log
    CustomLog ${APACHE_LOG_DIR}/weather-api-access.log combined
</VirtualHost>
