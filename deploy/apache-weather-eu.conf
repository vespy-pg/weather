<VirtualHost *:80>
    ServerName weather.vespy.eu
    ServerAdmin vespy.weather@gmail.com

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(.*)$ https://weather.vespy.eu/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/weather-eu-error.log
    CustomLog ${APACHE_LOG_DIR}/weather-eu-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName pogoda.vespy.eu
    ServerAdmin vespy.weather@gmail.com

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>
