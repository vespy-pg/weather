openapi: 3.1.0
info:
  title: Weather API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health
  /api/locations:
    get:
      operationId: searchLocations
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        '200':
          description: Matching locations
  /api/weather:
    get:
      operationId: getWeather
      parameters:
        - in: query
          name: latitude
          required: true
          schema:
            type: number
        - in: query
          name: longitude
          required: true
          schema:
            type: number
        - in: query
          name: timezone
          schema:
            type: string
        - in: query
          name: name
          schema:
            type: string
      responses:
        '200':
          description: Normalized current, hourly, and daily forecast

