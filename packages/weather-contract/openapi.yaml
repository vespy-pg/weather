openapi: 3.1.0
info:
  title: Weather API
  version: 0.2.0
paths:
  /api/health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health
  /api/locations:
    get:
      operationId: searchLocations
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
        - in: query
          name: language
          schema:
            type: string
            enum: [en-US, pl-PL]
      responses:
        '200':
          description: Matching locations
  /api/bootstrap-location:
    get:
      operationId: getBootstrapLocation
      responses:
        '200':
          description: Capital location selected from the country code supplied by the trusted reverse proxy
  /api/reverse-location:
    get:
      operationId: reverseLocation
      parameters:
        - in: query
          name: latitude
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - in: query
          name: longitude
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - in: query
          name: timezone
          schema:
            type: string
        - in: query
          name: language
          schema:
            type: string
            enum: [en-US, pl-PL]
      responses:
        '200':
          description: Nearest named locality for coordinates supplied after browser permission
        '400':
          description: Invalid coordinates
  /api/weather:
    get:
      operationId: getWeather
      parameters:
        - in: query
          name: latitude
          required: true
          schema:
            type: number
        - in: query
          name: longitude
          required: true
          schema:
            type: number
        - in: query
          name: timezone
          schema:
            type: string
        - in: query
          name: name
          schema:
            type: string
      responses:
        '200':
          description: Normalized current, hourly, and daily forecast
