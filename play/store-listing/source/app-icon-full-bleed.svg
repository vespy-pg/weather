    <g filter="url(#glowBlue)">
      <path transform="translate(70 10)" d="M617 389
               C617 389 561 470 561 520
               C561 562 586 589 617 589
               C649 589 674 562 674 520
               C674 471 617 389 617 389 Z"
            fill="url(#drop)"/>

      <path transform="translate(760 315) scale(.72) translate(-798 -484)" d="M798 484
               C798 484 763 534 763 565
               C763 591 779 607 798 607
               C817 607 833 591 833 565
               C833 534 798 484 798 484 Z"
            fill="url(#drop)"/>
    </g>

    <g fill="none" stroke-linecap="round">
      <path d="M78 620
               C190 630 255 572 342 584
               C444 598 483 724 590 738
               C696 752 754 602 872 606
               C930 608 963 635 986 648"
            stroke="url(#wave1)" stroke-width="18"/>

      <path d="M78 658
               C190 668 255 610 342 622
               C444 636 483 762 590 776
               C696 790 754 640 872 644
               C930 646 963 673 986 686"
            stroke="url(#wave2)" stroke-width="18"/>

      <path d="M78 696
               C190 706 255 648 342 660
               C444 674 483 800 590 814
               C696 828 754 678 872 682
               C930 684 963 711 986 724"
            stroke="url(#wave3)" stroke-width="18"/>
