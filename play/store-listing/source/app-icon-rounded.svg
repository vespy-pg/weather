<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1724"/>
      <stop offset="1" stop-color="#102238"/>
    </linearGradient>

    <radialGradient id="sun" cx="50%" cy="10%" r="90%">
      <stop offset="0" stop-color="#fff56a"/>
      <stop offset="0.45" stop-color="#ffd83d"/>
      <stop offset="1" stop-color="#ffb21f"/>
    </radialGradient>

    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe9ff"/>
      <stop offset="0.5" stop-color="#35bdf2"/>
      <stop offset="1" stop-color="#2878f5"/>
    </linearGradient>

    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bdcff"/>
      <stop offset="0.5" stop-color="#56bfdc"/>
      <stop offset="1" stop-color="#8fe0ff"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ea8d5"/>
      <stop offset="0.5" stop-color="#50bedb"/>
      <stop offset="1" stop-color="#4fa4d1"/>
    </linearGradient>

    <linearGradient id="wave3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6d98"/>
      <stop offset="0.5" stop-color="#3b89b0"/>
      <stop offset="1" stop-color="#326b96"/>
    </linearGradient>

    <filter id="glowSun" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="rounded">
      <rect x="38" y="38" width="948" height="948" rx="150"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="38" y="38" width="948" height="948" rx="150" fill="url(#bg)"/>

    <g filter="url(#glowSun)">
      <path d="M165 38 H859
               C835 118 760 181 670 214
               C572 250 452 252 352 220
               C259 190 188 128 165 38 Z"
            fill="url(#sun)"/>

      <g stroke="#ffd83d" stroke-width="24" stroke-linecap="round">
        <line x1="247" y1="236" x2="207" y2="292"/>
        <line x1="377" y1="282" x2="354" y2="349"/>
        <line x1="512" y1="300" x2="512" y2="378"/>
        <line x1="647" y1="282" x2="670" y2="349"/>
        <line x1="777" y1="236" x2="817" y2="292"/>
      </g>
    </g>

    <g filter="url(#glowBlue)">
      <path d="M617 389
               C617 389 561 470 561 520
               C561 562 586 589 617 589
               C649 589 674 562 674 520
               C674 471 617 389 617 389 Z"
            fill="url(#drop)"/>

      <path d="M798 484
               C798 484 763 534 763 565
               C763 591 779 607 798 607
               C817 607 833 591 833 565
               C833 534 798 484 798 484 Z"
            fill="url(#drop)"/>
    </g>

    <g fill="none" stroke-linecap="round">
      <path d="M78 703
               C182 703 206 608 322 608
               C442 608 469 751 602 751
               C730 751 754 669 874 669
               C923 669 950 693 986 703"
            stroke="url(#wave1)" stroke-width="18"/>

      <path d="M78 744
               C182 744 206 649 322 649
               C442 649 469 792 602 792
               C730 792 754 710 874 710
               C923 710 950 734 986 744"
            stroke="url(#wave2)" stroke-width="18"/>

      <path d="M78 786
               C182 786 206 691 322 691
               C442 691 469 834 602 834
               C730 834 754 752 874 752
               C923 752 950 776 986 786"
            stroke="url(#wave3)" stroke-width="18"/>
    </g>

    <rect x="38" y="38" width="948" height="948" rx="150"
          fill="none" stroke="#18314a" stroke-width="3"/>
  </g>
</svg>
