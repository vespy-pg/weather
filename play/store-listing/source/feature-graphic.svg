<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173b61"/>
      <stop offset="0.55" stop-color="#0e263f"/>
      <stop offset="1" stop-color="#08131f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd83d"/>
      <stop offset="0.48" stop-color="#45cf88"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <clipPath id="timeline"><rect x="42" y="302" width="940" height="159" rx="14"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1024" height="500" fill="url(#background)"/>
  <circle cx="900" cy="-88" r="230" fill="#ffd83d" opacity=".14"/>
  <path d="M770 56l-25 34M832 87l-10 42M900 97v44M968 87l10 42" stroke="#ffd83d" stroke-width="9" stroke-linecap="round" opacity=".55"/>
  <text x="50" y="75" fill="#75bdff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="4">VESPY WEATHER</text>
  <text x="50" y="154" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800">Weather at a glance</text>
  <text x="50" y="205" fill="#c1d1e3" font-family="Inter,Arial,sans-serif" font-size="25">Temperature, sky, rain and wind on one continuous timeline</text>
  <rect x="50" y="246" width="410" height="8" rx="4" fill="url(#accent)"/>
  <g filter="url(#shadow)">
    <rect x="42" y="302" width="940" height="159" rx="14" fill="#09111b" stroke="#3e5877" stroke-width="2"/>
    <image href="demo-timeline.png" x="42" y="302" width="940" height="159" preserveAspectRatio="none" clip-path="url(#timeline)"/>
  </g>
</svg>
