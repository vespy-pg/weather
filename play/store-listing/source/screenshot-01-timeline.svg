<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173f66"/><stop offset=".55" stop-color="#0b2035"/><stop offset="1" stop-color="#07111c"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".5"/></filter>
    <clipPath id="forecast"><rect x="75" y="386" width="1770" height="690" rx="30"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1700" cy="-320" r="650" fill="#ffd83d" opacity=".12"/>
  <text x="94" y="92" fill="#75bdff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="5">VESPY WEATHER</text>
  <text x="94" y="218" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="84" font-weight="800">See weather unfold</text>
  <text x="99" y="305" fill="#c2d2e4" font-family="Inter,Arial,sans-serif" font-size="33">Heat, rain, storms and gusts form one continuous story.</text>
  <g filter="url(#shadow)">
    <rect x="75" y="386" width="1770" height="690" rx="30" fill="#09111b" stroke="#557493" stroke-width="3"/>
    <g clip-path="url(#forecast)">
      <svg x="75" y="386" width="1770" height="690" viewBox="560 0 810 316" preserveAspectRatio="xMidYMid meet">
        <image href="demo-timeline.png" x="0" y="0" width="1871" height="316"/>
      </svg>
    </g>
  </g>
</svg>
