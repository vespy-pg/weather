<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173854"/><stop offset=".5" stop-color="#0c2635"/><stop offset="1" stop-color="#07151d"/></linearGradient>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".5"/></filter>
    <clipPath id="sky"><rect x="90" y="385" width="1740" height="260" rx="28"/></clipPath>
    <clipPath id="wind"><rect x="90" y="700" width="1740" height="300" rx="28"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1680" cy="-250" r="610" fill="#58a6ff" opacity=".09"/>
  <text x="94" y="96" fill="#75bdff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="5">MORE THAN A TEMPERATURE LINE</text>
  <text x="94" y="220" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="80" font-weight="800">Read the sky. See the wind.</text>
  <text x="99" y="305" fill="#c2d2e4" font-family="Inter,Arial,sans-serif" font-size="32">Clouds and precipitation sit above a wind trail shaped by speed and gusts.</text>
  <g filter="url(#shadow)">
    <rect x="90" y="385" width="1740" height="260" rx="28" fill="#09111b" stroke="#527090" stroke-width="3"/>
    <g clip-path="url(#sky)">
      <svg x="90" y="385" width="1740" height="260" viewBox="600 0 1150 115" preserveAspectRatio="xMidYMid meet">
        <image href="demo-timeline.png" x="0" y="0" width="1871" height="316"/>
      </svg>
    </g>
    <rect x="90" y="700" width="1740" height="300" rx="28" fill="#09111b" stroke="#527090" stroke-width="3"/>
    <g clip-path="url(#wind)">
      <svg x="90" y="700" width="1740" height="300" viewBox="600 118 1150 198" preserveAspectRatio="xMidYMid meet">
        <image href="demo-timeline.png" x="0" y="0" width="1871" height="316"/>
      </svg>
    </g>
  </g>
</svg>
