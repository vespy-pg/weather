<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173854"/>
      <stop offset=".5" stop-color="#0c2635"/>
      <stop offset="1" stop-color="#07151d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <clipPath id="home"><rect x="76" y="48" width="780" height="936" rx="38"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1780" cy="-180" r="590" fill="#58a6ff" opacity=".08"/>
  <g filter="url(#shadow)">
    <rect x="76" y="48" width="780" height="936" rx="38" fill="#09111b" stroke="#527090" stroke-width="3"/>
    <image href="widgets-home.png" x="76" y="48" width="780" height="936" preserveAspectRatio="xMidYMid slice" clip-path="url(#home)"/>
  </g>

  <text x="930" y="105" fill="#75bdff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800" letter-spacing="5">HOME-SCREEN WIDGETS</text>
  <text x="930" y="205" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="800">One forecast.</text>
  <text x="930" y="282" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="800">Three levels of detail.</text>
  <text x="934" y="344" fill="#c2d2e4" font-family="Inter,Arial,sans-serif" font-size="28">Pick the view that fits your home screen.</text>

  <g transform="translate(930 410)">
    <rect width="850" height="150" rx="24" fill="#142333" stroke="#2f5575" stroke-width="2"/>
    <circle cx="64" cy="75" r="34" fill="#58a6ff"/>
    <text x="64" y="86" text-anchor="middle" fill="#07111e" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="900">1</text>
    <text x="122" y="64" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="800">Weather timeline</text>
    <text x="122" y="106" fill="#aebfd1" font-family="Inter,Arial,sans-serif" font-size="25">Temperature chart + sky + wind</text>
  </g>
  <g transform="translate(930 590)">
    <rect width="850" height="150" rx="24" fill="#142333" stroke="#2f5575" stroke-width="2"/>
    <circle cx="64" cy="75" r="34" fill="#58a6ff"/>
    <text x="64" y="86" text-anchor="middle" fill="#07111e" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="900">2</text>
    <text x="122" y="64" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="800">Weather and warnings</text>
    <text x="122" y="106" fill="#aebfd1" font-family="Inter,Arial,sans-serif" font-size="25">Full timeline + multi-event outlook</text>
  </g>
  <g transform="translate(930 770)">
    <rect width="850" height="150" rx="24" fill="#142333" stroke="#2f5575" stroke-width="2"/>
    <circle cx="64" cy="75" r="34" fill="#58a6ff"/>
    <text x="64" y="86" text-anchor="middle" fill="#07111e" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="900">3</text>
    <text x="122" y="64" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="800">Sky and wind</text>
    <text x="122" y="106" fill="#aebfd1" font-family="Inter,Arial,sans-serif" font-size="25">Compact one-row forecast</text>
  </g>
  <text x="934" y="984" fill="#75bdff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800">RESIZABLE WIDTH · INDEPENDENT LOCATION · LIGHT OR DARK</text>
</svg>
