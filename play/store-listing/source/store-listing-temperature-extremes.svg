<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="slide-title slide-description">
  <title id="slide-title">From summer heat to winter frost</title>
  <desc id="slide-description">Two real Vespy Weather forecasts compare extreme summer heat with winter frost and snow.</desc>

  <style>
    .text-eyebrow {
      fill: #75bdff;
      font-family: Inter, Arial, sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 5px;
    }

    .text-title {
      fill: #ffffff;
      font-family: Inter, Arial, sans-serif;
      font-size: 80px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .text-subtitle {
      fill: #c2d2e4;
      font-family: Inter, Arial, sans-serif;
      font-size: 32px;
      font-weight: 400;
    }

    .text-panel-label {
      fill: #ffffff;
      font-family: Inter, Arial, sans-serif;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 2px;
    }
  </style>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173854"/>
      <stop offset=".5" stop-color="#0c2635"/>
      <stop offset="1" stop-color="#07151d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#000000" flood-opacity=".48"/>
    </filter>
    <clipPath id="summer-clip"><rect x="75" y="375" width="850" height="650" rx="28"/></clipPath>
    <clipPath id="winter-clip"><rect x="995" y="375" width="850" height="650" rx="28"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1780" cy="-180" r="590" fill="#58a6ff" opacity=".08"/>
  <circle cx="280" cy="1120" r="560" fill="#ff9f32" opacity=".06"/>
  <circle cx="1730" cy="1120" r="560" fill="#75bdff" opacity=".07"/>

  <text class="text-eyebrow" x="94" y="96">CONDITIONS AT A GLANCE</text>
  <text class="text-title" x="94" y="220">From summer heat to winter frost</text>
  <text class="text-subtitle" x="99" y="305">Colour, sky and precipitation make every extreme immediately visible.</text>

  <g filter="url(#shadow)">
    <rect x="75" y="375" width="850" height="650" rx="28" fill="#09111b" stroke="#a66d32" stroke-width="3"/>
    <g clip-path="url(#summer-clip)">
      <svg x="75" y="375" width="850" height="650" viewBox="0 0 973 744" preserveAspectRatio="xMidYMid slice">
        <image href="summer-heat.png" x="0" y="0" width="973" height="868"/>
      </svg>
    </g>

    <rect x="995" y="375" width="850" height="650" rx="28" fill="#09111b" stroke="#527ca7" stroke-width="3"/>
    <g clip-path="url(#winter-clip)">
      <svg x="995" y="375" width="850" height="650" viewBox="0 0 973 744" preserveAspectRatio="xMidYMid slice">
        <image href="winter-frost.png" x="0" y="0" width="973" height="871"/>
      </svg>
    </g>
  </g>

  <g transform="translate(105 965)">
    <rect width="234" height="46" rx="23" fill="#a66d32" opacity=".94"/>
    <text class="text-panel-label" x="117" y="31" text-anchor="middle">SUMMER HEAT</text>
  </g>
  <g transform="translate(1025 965)">
    <rect width="236" height="46" rx="23" fill="#315d87" opacity=".96"/>
    <text class="text-panel-label" x="118" y="31" text-anchor="middle">WINTER FROST</text>
  </g>
</svg>
