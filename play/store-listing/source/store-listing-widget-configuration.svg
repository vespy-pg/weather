<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="slide-title slide-description">
  <title id="slide-title">Build the widget around your day</title>
  <desc id="slide-description">A real Vespy Weather widget configuration screen with independent location, forecast length and appearance settings.</desc>

  <style>
    .text-eyebrow {
      fill: #75bdff;
      font-family: Inter, Arial, sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 5px;
    }

    .text-title {
      fill: #ffffff;
      font-family: Inter, Arial, sans-serif;
      font-size: 82px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .text-subtitle {
      fill: #c2d2e4;
      font-family: Inter, Arial, sans-serif;
      font-size: 33px;
      font-weight: 400;
    }

    .text-feature {
      fill: #e7edf7;
      font-family: Inter, Arial, sans-serif;
      font-size: 29px;
      font-weight: 700;
    }

    .text-footer {
      fill: #75bdff;
      font-family: Inter, Arial, sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }
  </style>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173854"/>
      <stop offset=".5" stop-color="#0c2635"/>
      <stop offset="1" stop-color="#07151d"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-15%" width="150%" height="145%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <clipPath id="screen-clip">
      <rect x="85" y="55" width="540" height="970" rx="34"/>
    </clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1780" cy="-180" r="590" fill="#58a6ff" opacity=".08"/>
  <circle cx="1740" cy="1100" r="520" fill="#45cf88" opacity=".05"/>

  <g filter="url(#shadow)">
    <rect x="85" y="55" width="540" height="970" rx="34" fill="#09111b" stroke="#527090" stroke-width="3"/>
    <image
      href="widget-configuration-london.png"
      x="85"
      y="55"
      width="540"
      height="1151.5"
      preserveAspectRatio="none"
      clip-path="url(#screen-clip)"
    />
  </g>

  <text class="text-eyebrow" x="750" y="145">YOUR FORECAST, YOUR WIDGET</text>
  <text class="text-title" x="750" y="285">Build the widget</text>
  <text class="text-title" x="750" y="375">around your day</text>
  <text class="text-subtitle" x="755" y="460">Configure every widget independently.</text>

  <g transform="translate(755 585)">
    <circle cx="9" cy="-9" r="9" fill="#ffd83d"/>
    <text class="text-feature" x="40" y="2">Choose its location</text>
  </g>
  <g transform="translate(755 665)">
    <circle cx="9" cy="-9" r="9" fill="#45cf88"/>
    <text class="text-feature" x="40" y="2">Set the forecast length</text>
  </g>
  <g transform="translate(755 745)">
    <circle cx="9" cy="-9" r="9" fill="#58a6ff"/>
    <text class="text-feature" x="40" y="2">Select light, dark or system theme</text>
  </g>
  <g transform="translate(755 825)">
    <circle cx="9" cy="-9" r="9" fill="#8bdcff"/>
    <text class="text-feature" x="40" y="2">Control the displayed information</text>
  </g>

  <text class="text-footer" x="755" y="955">EACH WIDGET KEEPS ITS OWN SETTINGS</text>
</svg>
